openapi: 3.1.0
info:
  title: Smokrates studio API
  version: 0.0.0
  description: Browser-to-API contract for the local review page and the launchd tick. Write an operation here before its handler. The API never returns a token. All dates use the Europe/Ljubljana timezone.
servers:
  - url: http://127.0.0.1:8724
paths:
  /api/plans:
    post:
      operationId: plan.import
      summary: Load a hand-written week. Refuses with 409 if the week exists and any episode is not planned, unless replace is true. Validates every caption and prompt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanImport"
      responses:
        "201":
          description: Plan written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/plans/{weekStart}:
    get:
      operationId: plan.get
      summary: Read the plan and its episodes for one week.
      parameters:
        - $ref: "#/components/parameters/WeekStart"
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        default:
          $ref: "#/components/responses/Error"
  /api/plans/{weekStart}/approve:
    post:
      operationId: week.approve
      summary: Approve every ready episode of the week. The scheduler may then send them.
      parameters:
        - $ref: "#/components/parameters/WeekStart"
      responses:
        "200":
          description: Week approved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        default:
          $ref: "#/components/responses/Error"
  /api/episodes/{episodeId}:
    patch:
      operationId: episode.update
      summary: Change the time, caption, track, start second, format or label decision of one episode.
      parameters:
        - $ref: "#/components/parameters/EpisodeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EpisodeUpdate"
      responses:
        "200":
          description: Episode updated. A change to track, start second or format clears the render.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Episode"
        default:
          $ref: "#/components/responses/Error"
  /api/episodes/{episodeId}/approve:
    post:
      operationId: episode.approve
      summary: Approve one rendered episode.
      parameters:
        - $ref: "#/components/parameters/EpisodeId"
      responses:
        "200":
          description: Episode approved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Episode"
        default:
          $ref: "#/components/responses/Error"
  /api/episodes/{episodeId}/skip:
    post:
      operationId: episode.skip
      summary: Skip one night. A skipped episode is never sent.
      parameters:
        - $ref: "#/components/parameters/EpisodeId"
      responses:
        "200":
          description: Episode skipped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Episode"
        default:
          $ref: "#/components/responses/Error"
  /api/episodes/{episodeId}/render:
    post:
      operationId: episode.render
      summary: Enqueue the render of one episode to a 9:16 master. Returns the job. Poll job.get.
      parameters:
        - $ref: "#/components/parameters/EpisodeId"
      responses:
        "202":
          description: Render job queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        default:
          $ref: "#/components/responses/Error"
  /api/jobs/{jobId}:
    get:
      operationId: job.get
      summary: Read one job. A job is long work such as a render or a send.
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        default:
          $ref: "#/components/responses/Error"
  /api/canon:
    get:
      operationId: canon.get
      summary: Read the approved canonical still, if there is one.
      responses:
        "200":
          description: The canonical still.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Canon"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: canon.approve
      summary: Admin approves the canonical still of the man. Later pictures descend from it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CanonApprove"
      responses:
        "200":
          description: Canonical still set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Canon"
        default:
          $ref: "#/components/responses/Error"
  /api/assets:
    get:
      operationId: assets.list
      summary: List stills and clips, newest first. The Admin picks the canonical still from this list.
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [still, clip]
      responses:
        "200":
          description: The assets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
        default:
          $ref: "#/components/responses/Error"
  /api/health:
    get:
      operationId: health.get
      summary: Say whether the daemon is up, which schema version it runs, and whether a worker is busy.
      responses:
        "200":
          description: The daemon is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Error"
  /api/tick:
    post:
      operationId: tick.run
      summary: Called by launchd every 15 minutes. Sends due, approved episodes. Idempotent.
      responses:
        "202":
          description: Work was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "200":
          description: Nothing is due.
        default:
          $ref: "#/components/responses/Error"
  /api/connections:
    get:
      operationId: connections.list
      summary: List the platforms and whether each is connected. Derived from the token files. Never returns a token.
      responses:
        "200":
          description: The connections.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Connection"
        default:
          $ref: "#/components/responses/Error"
  /api/publishes:
    get:
      operationId: publishes.list
      summary: List the publish log for one week.
      parameters:
        - name: weekStart
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/WeekStart"
      responses:
        "200":
          description: The publishes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Publish"
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    WeekStart:
      name: weekStart
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/WeekStart"
    EpisodeId:
      name: episodeId
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: The call failed. The message is plain words the Creator can act on.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    WeekStart:
      type: string
      format: date
      description: The Monday of the week, as YYYY-MM-DD, in the Europe/Ljubljana timezone.
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        field:
          type: string
          description: The input field the message is about, when the failure is a bad value. The page keeps the typed value next to it.
    PlanImport:
      type: object
      required: [weekStart, episodes]
      properties:
        weekStart:
          $ref: "#/components/schemas/WeekStart"
        replace:
          type: boolean
          default: false
          description: Replace an existing week even if an episode is past planned.
        episodes:
          type: array
          maxItems: 7
          items:
            $ref: "#/components/schemas/EpisodeInput"
    Plan:
      type: object
      required: [weekStart, status, episodes]
      properties:
        weekStart:
          $ref: "#/components/schemas/WeekStart"
        status:
          type: string
          enum: [draft, approved]
        episodes:
          type: array
          items:
            $ref: "#/components/schemas/Episode"
    EpisodeInput:
      type: object
      required: [night, format, trackSlug, startSecond, durationSeconds, caption, claim, publishAt, labelDecision]
      properties:
        night:
          type: integer
          minimum: 1
          maximum: 7
        format:
          $ref: "#/components/schemas/Format"
        trackSlug:
          type: string
        startSecond:
          type: number
          minimum: 0
        durationSeconds:
          type: number
          exclusiveMinimum: 0
        caption:
          type: string
          description: Plain words. The API refuses a health claim.
        claim:
          type: string
        publishAt:
          type: string
          format: date-time
          description: Europe/Ljubljana offset.
        labelDecision:
          $ref: "#/components/schemas/LabelDecision"
        groksPrompt:
          type: string
          description: Only for the scene format. The API refuses the word SMOKRATES, a hex code or a health claim.
    Episode:
      type: object
      required: [id, night, format, trackSlug, startSecond, durationSeconds, caption, claim, publishAt, labelDecision, status]
      properties:
        id:
          type: string
        night:
          type: integer
          minimum: 1
          maximum: 7
        format:
          $ref: "#/components/schemas/Format"
        trackSlug:
          type: string
        startSecond:
          type: number
          minimum: 0
        durationSeconds:
          type: number
          exclusiveMinimum: 0
        caption:
          type: string
          description: Plain words. The API refuses a health claim.
        claim:
          type: string
        publishAt:
          type: string
          format: date-time
          description: Europe/Ljubljana offset.
        labelDecision:
          $ref: "#/components/schemas/LabelDecision"
        status:
          type: string
          enum: [planned, rendering, ready, approved, skipped, not_new]
        renderPath:
          type: string
          description: out/<episodeId>.mp4
    EpisodeUpdate:
      type: object
      minProperties: 1
      properties:
        publishAt:
          type: string
          format: date-time
        caption:
          type: string
          description: The API refuses a health claim.
        trackSlug:
          type: string
        startSecond:
          type: number
          minimum: 0
        durationSeconds:
          type: number
          exclusiveMinimum: 0
        format:
          $ref: "#/components/schemas/Format"
        labelDecision:
          $ref: "#/components/schemas/LabelDecision"
    Format:
      type: string
      enum: [track_card, scene, loop, title]
    LabelDecision:
      type: string
      enum: [label_on, label_off]
    CanonApprove:
      type: object
      required: [assetId]
      properties:
        assetId:
          type: string
    Canon:
      type: object
      required: [assetId, approvedAt]
      properties:
        assetId:
          type: string
        approvedAt:
          type: string
          format: date-time
    Asset:
      type: object
      required: [id, kind, filePath, isApproved]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [still, clip]
        parentAssetId:
          type: string
        filePath:
          type: string
        isApproved:
          type: boolean
    Health:
      type: object
      required: [isUp, schemaVersion, isWorkerBusy]
      properties:
        isUp:
          type: boolean
        schemaVersion:
          type: integer
        isWorkerBusy:
          type: boolean
    Job:
      type: object
      required: [id, kind, status]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [render, asset, send]
        episodeId:
          type: string
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        message:
          type: string
          description: Plain words on failure.
        createdAt:
          type: string
          format: date-time
    Connection:
      type: object
      description: Derived from the token files. Not stored.
      required: [platform, isConnected, environment, scopes]
      properties:
        platform:
          type: string
          enum: [tiktok, youtube]
        isConnected:
          type: boolean
        environment:
          type: string
          enum: [sandbox, production]
        scopes:
          type: array
          items:
            type: string
    Publish:
      type: object
      description: One row per episode and platform. Written at TikTok init.
      required: [id, episodeId, platform, status, attempts]
      properties:
        id:
          type: string
        episodeId:
          type: string
        platform:
          type: string
          enum: [tiktok, youtube]
        externalId:
          type: string
          description: The TikTok publish_id.
        status:
          type: string
          enum: [processing, sent, stalled, failed]
        attempts:
          type: integer
        lastCheckedAt:
          type: string
          format: date-time
